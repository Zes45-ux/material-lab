<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="cache-control" content="max-age=3600" />
    <meta http-equiv="cache-control" content="stale-while-revalidate=864000" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta
      name="description"
      content="A standalone falling-sand sandbox for exploring pixel materials and physical reactions, built with Rust/WASM, WebGL, and JavaScript."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="32x32" href="<%= htmlWebpackPlugin.options.assetPrefix %>assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="<%= htmlWebpackPlugin.options.assetPrefix %>assets/favicon-16x16.png" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ccbcbc" />
    <title>Material Lab</title>
    <link rel="manifest" href="<%= htmlWebpackPlugin.options.assetPrefix %>manifest.json" />
    <link rel="stylesheet" type="text/css" href="<%= htmlWebpackPlugin.options.assetPrefix %>styles.css" />
  </head>
  <body data-view="<%= htmlWebpackPlugin.options.view %>">
    <div id="background" data-inspector-open="false">
      <div id="ui"></div>
      <div id="fps"></div>
      <main id="canvas-stage" aria-label="沙粒实验画布">
        <canvas id="sand-canvas"></canvas>
        <canvas id="fluid-canvas"></canvas>
      </main>
    </div>
  </body>
</html>
